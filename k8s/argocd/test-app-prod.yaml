apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/zakhardenwp/test-app.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: test-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
