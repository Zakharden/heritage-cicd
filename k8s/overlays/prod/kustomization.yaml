apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-app
resources:
  - ./resources/namespace.yaml
  - ./resources/backend.yaml
  - ./resources/ui.yaml
  - ./resources/ingress.yaml
images:
  - name: backend-image
    newName: docker.io/zakharden/test-app-backend
    newTag: "0.0.1"
  - name: ui-image
    newName: registry.example.com/test-app/ui
    newTag: "0.0.0"
